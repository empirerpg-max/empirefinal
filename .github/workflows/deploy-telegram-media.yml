name: Deploy Telegram Media Service

on:
  push:
    branches: [main]
    paths:
      - "telegram-media/**"
      - ".github/workflows/deploy-telegram-media.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autentica no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy no Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: empire-telegram-media
          region: southamerica-east1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: telegram-media
          flags: --min-instances=1 --allow-unauthenticated
          env_vars: |
            TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
            TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            ADMIN_TOKEN=${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN }}

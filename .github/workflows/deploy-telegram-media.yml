name: Deploy Telegram Media Service

on:
  push:
    branches: [main]
    paths:
      - "telegram-media/**"
      - ".github/workflows/deploy-telegram-media.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Cria o app no Fly.io (se ainda não existir)
        working-directory: telegram-media
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create empire-telegram-media || true
      - name: Atualiza os secrets do serviço
        working-directory: telegram-media
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            TELEGRAM_API_ID="${{ secrets.TELEGRAM_API_ID }}" \
            TELEGRAM_API_HASH="${{ secrets.TELEGRAM_API_HASH }}" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ADMIN_TOKEN="${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN }}" \
            --stage
      - name: Deploy to Fly.io
        working-directory: telegram-media
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

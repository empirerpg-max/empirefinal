name: Debug Fetch Empire Play
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch home
        run: |
          echo "=== HOME ==="
          curl -s "https://tanstack-start-app.empirerpg-forum.workers.dev/api/empire-play/home" | python3 -c "
import json,sys
d = json.load(sys.stdin)
data = d.get('data', {})
for key in ['topSpotify','topAppleMusic','topYoutube','recentMusicas']:
    items = data.get(key, [])
    print(f'--- {key} ({len(items)}) ---')
    for it in items[:3]:
        print(json.dumps(it, ensure_ascii=False))
"

name: Debug Scores Check
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize scores
        run: |
          for ep in musicas albuns videos; do
            echo "=== $ep ==="
            curl -s "https://tanstack-start-app.empirerpg-forum.workers.dev/api/empire-play/$ep" > /tmp/$ep.json
            python3 -c "
import json
d = json.load(open('/tmp/$ep.json'))
items = d.get('data', [])
total = len(items)
with_score = 0
sample = []
for it in items:
    score = it.get('metacriticAvg')
    if score:
        with_score += 1
        if len(sample) < 5:
            sample.append({'title': it.get('title'), 'artist': it.get('artist'), 'metacriticAvg': score})
print('total:', total, 'with_score:', with_score)
for s in sample:
    print(s)
"
          done

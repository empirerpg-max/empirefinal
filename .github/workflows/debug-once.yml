    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          echo "=== agora (UTC) ==="
          date -u
          echo "=== /api/tv/programas ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/tv/programas" | tee /tmp/out.json

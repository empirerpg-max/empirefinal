name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          echo "=== agora (UTC) ==="
          date -u
          echo "=== retag WISDOM (linha 301) ==="
          curl -sS -X POST "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/musicvideos-retag" \
            -H "Content-Type: application/json" \
            -d '{"linha":301,"tituloEsperado":"SA5M - WISDOM"}'
          echo
          echo "=== retag CURSED BLESSED (linha 302) ==="
          curl -sS -X POST "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/musicvideos-retag" \
            -H "Content-Type: application/json" \
            -d '{"linha":302,"tituloEsperado":"Samantha Cooper - CURSED BLESSED"}'
          echo
          echo "=== verificacao: wisdom ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/musicvideos-buscar?q=wisdom"
          echo
          echo "=== verificacao: cursed ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/musicvideos-buscar?q=cursed"

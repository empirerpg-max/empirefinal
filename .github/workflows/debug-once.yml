name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          pip install --quiet Pillow numpy scipy
          curl -sS -o apple_base.png "https://tanstack-start-app.empirerpg-forum.workers.dev/api/media/image?id=1Kq9AZ3We9NfEGXOR3CaXX1aISL3_4DCw"
          python3 << 'EOF'
          import numpy as np
          from PIL import Image
          from scipy import ndimage

          im = Image.open("apple_base.png").convert("RGBA")
          w, h = im.size
          arr = np.array(im)
          r, g, b, a = arr[:,:,0], arr[:,:,1], arr[:,:,2], arr[:,:,3]
          # quadrados pretos sólidos e opacos (nao transparentes)
          is_black = (r < 15) & (g < 15) & (b < 15) & (a > 200)
          labeled, n = ndimage.label(is_black)
          print(f"{w}x{h} — {n} regioes pretas")
          regions = []
          for i in range(1, n+1):
              ys, xs = np.where(labeled == i)
              if len(xs) < 5000:
                  continue
              x0,x1 = xs.min(), xs.max()
              y0,y1 = ys.min(), ys.max()
              regions.append((x0,y0,x1-x0,y1-y0,len(xs)))
          regions.sort(key=lambda r: r[0])
          for (x,y,rw,rh,area) in regions:
              print(f"  x={x} y={y} w={rw} h={rh} area={area} pct_w={rw/w*100:.1f}% pct_h={rh/h*100:.1f}%")
          EOF

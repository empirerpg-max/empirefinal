name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{"fileName":"debug-test.png","mimeType":"image/png","base64Data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=","folderType":"socialAvatars"}' \
            --max-time 45 -w "\nHTTP_STATUS:%{http_code} TIME_TOTAL:%{time_total}s\n" \
            "https://tanstack-start-app.empirerpg-forum.workers.dev/api/gestao/upload" | tee /tmp/out.json

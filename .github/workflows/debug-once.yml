name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          echo "=== agora (UTC) ==="
          date -u
          echo "=== /api/empire-play/videos (procurando WISDOM / CURSED BLESSED) ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/empire-play/videos" > /tmp/out.json
          jq -c '(.data // .)[] | select((.titulo // "" | ascii_downcase | contains("wisdom")) or (.titulo // "" | ascii_downcase | contains("cursed")))' /tmp/out.json

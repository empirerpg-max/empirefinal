name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Kick API directly
        run: |
          curl -sS -D - "https://kick.com/api/v2/channels/empiretvoficial" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Accept: application/json" | head -c 3000
      - name: Check listar_albuns for Matthew (legacy Apps Script, follow redirects)
        run: |
          curl -sS -L -D - "https://script.google.com/macros/s/AKfycbwxbkUndhZPtFvtK1uIFTkPNN-m6WeiFVMU3IDzuahsC0oQp8Ba2GLQFOAPkWv8eiA3/exec?acao=listar_albuns&nome=Matthew" | head -c 3000
      - name: Check listar_albuns unfiltered (all albums)
        run: |
          echo ""
          curl -sS -L "https://script.google.com/macros/s/AKfycbwxbkUndhZPtFvtK1uIFTkPNN-m6WeiFVMU3IDzuahsC0oQp8Ba2GLQFOAPkWv8eiA3/exec?acao=listar_albuns" | head -c 3000

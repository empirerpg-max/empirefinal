name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl root headers
        run: curl -sSI "https://tanstack-start-app.empirerpg-forum.workers.dev/"
      - name: Curl root body (grep script tags)
        run: curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/" | grep -oE '(src|href)="[^"]*"' | sort -u

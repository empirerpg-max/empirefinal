name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          echo "--- musicas (loreena, chartsBase apple #1) ---"
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/empire-play/musicas" | jq -c '.data[] | select(.artist | ascii_downcase | contains("loreena")) | {title, artist, audioUrl}'
          echo "--- videos (marco, chartsBase youtube #1) ---"
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/empire-play/videos" | jq -c '.data[] | select(.artist | ascii_downcase | contains("marco")) | {title, artist, videoUrl, audioUrl}'

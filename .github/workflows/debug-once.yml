name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          echo "=== agora (UTC) ==="
          date -u
          echo "=== PONTOS: wisdom ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/pontos-buscar?q=wisdom"
          echo
          echo "=== PONTOS: cursed ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/pontos-buscar?q=cursed"
          echo
          echo "=== PONTOS: sa5m (pra ver formato geral da coluna D) ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/debug/pontos-buscar?q=sa5m"

name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: curl -sS -o cover.png "https://tanstack-start-app.empirerpg-forum.workers.dev/api/media/image?id=1HzcUaW91zn-45UbGjFotDS3BQs8kMTcR"
      - name: Upload cover as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-cover
          path: cover.png

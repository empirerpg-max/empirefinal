name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          echo "=== agora (UTC) ==="
          date -u
          echo "=== /api/turnes (buscando show Paradiso #7) ==="
          curl -sS "https://tanstack-start-app.empirerpg-forum.workers.dev/api/turnes" > /tmp/out.json
          jq -c '(.data // .)[] | {idUnico, artista, show: (.agenda[] | select(.local=="Paradiso" and .numero==7))}' /tmp/out.json

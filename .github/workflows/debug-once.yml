name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          pip install --quiet Pillow numpy scipy
          declare -A FILES=(
            [spotify_base]="1HzcUaW91zn-45UbGjFotDS3BQs8kMTcR"
            [spotify_sub]="1DggkwV5S3JEjwNIl2TCJXKQktbFPI5Ch"
            [apple_base]="1Kq9AZ3We9NfEGXOR3CaXX1aISL3_4DCw"
            [youtube_base]="1iL2PWPgHW30YuTGK4tQMobBESnCMD0Es"
            [youtube_sub]="13ygT5tAFmgVRIC2Wd7qa74xj6Yi4EMjR"
            [hot_base]="1yXHsKqvdpdM2F2F4hP5ksP6YVugmh6_C"
            [hot_sub]="1D_zfoJ2hASAkdKhq6tHDvQYoNLSLju-K"
          )
          for name in "${!FILES[@]}"; do
            curl -sS -o "$name.png" "https://tanstack-start-app.empirerpg-forum.workers.dev/api/media/image?id=${FILES[$name]}"
          done
          ls -la *.png
          python3 << 'EOF'
          import numpy as np
          from PIL import Image
          from scipy import ndimage
          import glob

          for path in sorted(glob.glob("*.png")):
              im = Image.open(path).convert("RGBA")
              w, h = im.size
              arr = np.array(im)
              alpha = arr[:, :, 3]
              transparent = alpha < 200
              labeled, n = ndimage.label(transparent)
              print(f"\n=== {path} ({w}x{h}) — {n} regioes transparentes ===")
              regions = []
              for i in range(1, n + 1):
                  ys, xs = np.where(labeled == i)
                  if len(xs) < 500:
                      continue
                  x0, x1 = xs.min(), xs.max()
                  y0, y1 = ys.min(), ys.max()
                  regions.append((x0, y0, x1 - x0, y1 - y0, len(xs)))
              regions.sort(key=lambda r: r[0])
              for (x, y, rw, rh, area) in regions:
                  print(f"  x={x} y={y} w={rw} h={rh} area_px={area} pct_w={rw/w*100:.1f}% pct_h={rh/h*100:.1f}%")
          EOF

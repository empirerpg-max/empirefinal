name: Debug Once
on:
  workflow_dispatch: {}
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - name: Curl debug endpoint
        run: |
          pip install --quiet Pillow
          declare -A FILES=(
            [apple_base]="1Kq9AZ3We9NfEGXOR3CaXX1aISL3_4DCw"
            [hot_base]="1yXHsKqvdpdM2F2F4hP5ksP6YVugmh6_C"
            [hot_sub]="1D_zfoJ2hASAkdKhq6tHDvQYoNLSLju-K"
            [youtube_base]="1iL2PWPgHW30YuTGK4tQMobBESnCMD0Es"
            [youtube_sub]="13ygT5tAFmgVRIC2Wd7qa74xj6Yi4EMjR"
            [spotify_sub]="1DggkwV5S3JEjwNIl2TCJXKQktbFPI5Ch"
          )
          for name in "${!FILES[@]}"; do
            curl -sS -o "$name.png" "https://tanstack-start-app.empirerpg-forum.workers.dev/api/media/image?id=${FILES[$name]}"
            python3 -c "
          from PIL import Image
          im = Image.open('$name.png').convert('RGB')
          im.thumbnail((500,500))
          im.save('${name}_small.jpg', quality=60)
          "
            echo "=== $name ==="
            echo "===BASE64_START_${name}==="
            base64 -w 200 "${name}_small.jpg"
            echo "===BASE64_END_${name}==="
          done

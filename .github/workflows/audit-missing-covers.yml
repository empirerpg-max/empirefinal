name: Auditar capas sumidas no Drive (só leitura)

on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-sagan-woiah1]
    paths:
      - .github/workflows/audit-missing-covers.yml
      - telegram-media/scripts/audit-missing-covers.ts

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: telegram-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Auditar
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: npx tsx scripts/audit-missing-covers.ts

name: Debug Social Tabs
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/social/posts
        run: |
          echo "=== /api/social/posts ==="
          curl -s "https://tanstack-start-app.empirerpg-forum.workers.dev/api/social/posts"
          echo ""
      - name: GET /api/social/perfis
        run: |
          echo "=== /api/social/perfis ==="
          curl -s "https://tanstack-start-app.empirerpg-forum.workers.dev/api/social/perfis"
          echo ""
      - name: GET /api/social/news
        run: |
          echo "=== /api/social/news ==="
          curl -s "https://tanstack-start-app.empirerpg-forum.workers.dev/api/social/news"
          echo ""
      - name: POST /api/social/posts (teste)
        run: |
          echo "=== POST /api/social/posts ==="
          curl -s -X POST "https://tanstack-start-app.empirerpg-forum.workers.dev/api/social/posts" \
            -H "Content-Type: application/json" \
            -d '{"payload":"{\"tipo\":\"Instagram\",\"subtipo\":\"Feed\",\"autor\":\"Matthew\",\"texto\":\"teste-worker-migration\"}","tgId":"1625310906"}'
          echo ""
      - name: GET /api/social/comentarios (postId inexistente, só checar formato)
        run: |
          echo "=== /api/social/comentarios ==="
          curl -s "https://tanstack-start-app.empirerpg-forum.workers.dev/api/social/comentarios?postId=POST-da4ce495"
          echo ""

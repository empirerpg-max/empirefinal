name: Link de teste (sala da Empire TV)

# Sobe uma CÓPIA DE TESTE do app (uma "versão" do Worker com link próprio),
# sem trocar o app que os jogadores usam: `wrangler versions upload` só cria
# a versão e o link de prévia; quem publica de verdade continua sendo o
# deploy.yml, quando algo entra na main.
#
# ATENÇÃO: a cópia de teste usa os MESMOS dados de produção (D1, planilhas,
# chat do Supabase, segredos do Worker). Testar numa sala de TESTE, fora do
# horário dos eventos. Ninguém deve assistir um evento real pelo link de teste
# (a participação iria para o D1, mas quem credita os eventos reais ainda é a
# versão publicada, que lê a planilha).

on:
  push:
    branches: [claude/nice-euler-1yslj3]
  workflow_dispatch: {}

concurrency:
  group: preview-sala-tv
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Os dois workflows (deploy.yml e preview-sala-tv.yml) mexem no MESMO
      # Worker (tanstack-start-app). Em 28/11 o `secret put` do deploy falhou
      # porque a prévia subiu uma versão no meio. Este passo só ESPERA — nunca
      # cancela nada (um grupo de concorrência compartilhado poderia cancelar
      # um deploy de produção que estivesse na fila).
      # Espera só as execuções do outro workflow CRIADAS ANTES desta (em
      # andamento ou na fila): a mais antiga sempre passa primeiro, então os
      # dois nunca ficam esperando um ao outro.
      # Confere a cada 15 s, no máximo 10 min; depois segue com um aviso. Se a
      # consulta falhar (ex.: token sem permissão de ler Actions), não trava:
      # segue com um aviso no log.
      - name: Esperar deploy.yml mais antigo terminar (mesmo Worker)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem `shell: bash` o padrão é `bash -e` (sem pipefail): sem isto, falha
          # do `gh` no pipe com o jq passaria despercebida (n vazio).
          set -o pipefail
          if ! meu=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt); then
            echo "::warning::Não consegui ler o horário desta execução; seguindo sem esperar."
            exit 0
          fi
          fim=$((SECONDS + 600))
          while true; do
            if ! n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 20 --json status,createdAt \
                | jq --arg meu "$meu" '[.[] | select(.createdAt < $meu and (.status == "in_progress" or .status == "queued"))] | length'); then
              echo "::warning::Não consegui consultar deploy.yml; seguindo sem esperar."
              break
            fi
            [ "$n" = "0" ] && break
            if [ "$SECONDS" -ge "$fim" ]; then
              echo "::warning::deploy.yml mais antigo ainda rodando depois de 10 min; seguindo mesmo assim."
              break
            fi
            echo "deploy.yml mais antigo rodando ($n); esperando 15 s..."
            sleep 15
          done

      - name: Build
        run: bun run build

      - name: Subir versão de teste (não publica)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler versions upload \
            -c dist/tanstack_start_app/wrangler.json \
            --preview-alias sala-tv \
            --tag "sala-tv-${GITHUB_SHA::7}" \
            --message "Teste da sala da Empire TV (${GITHUB_SHA::7})" | tee upload.log
          echo "## Link de teste" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^ ]+workers\.dev[^ ]*' upload.log | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

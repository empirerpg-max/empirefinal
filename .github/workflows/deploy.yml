name: Deploy Empire Hub

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      - name: Set Telegram media proxy secret
        if: ${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN }}" | bunx wrangler secret put TELEGRAM_MEDIA_ADMIN_TOKEN -c dist/tanstack_start_app/wrangler.json

      - name: Set Google Sheets service account secret
        if: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' | bunx wrangler secret put GOOGLE_SHEETS_CREDENTIALS -c dist/tanstack_start_app/wrangler.json

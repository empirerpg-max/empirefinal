name: Deploy Empire Hub

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      - name: Set Telegram media proxy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_MEDIA_ADMIN_TOKEN: ${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_MEDIA_ADMIN_TOKEN" ]; then
            echo "$TELEGRAM_MEDIA_ADMIN_TOKEN" | bunx wrangler secret put TELEGRAM_MEDIA_ADMIN_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Google Sheets service account secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" | bunx wrangler secret put GOOGLE_SHEETS_CREDENTIALS -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set GitHub Actions dispatch token (botão "Reportar problema")
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GITHUB_DISPATCH_TOKEN" ]; then
            echo "$GITHUB_DISPATCH_TOKEN" | bunx wrangler secret put GITHUB_DISPATCH_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

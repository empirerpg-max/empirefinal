name: Deploy Empire Hub

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      - name: Set Telegram media proxy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_MEDIA_ADMIN_TOKEN: ${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_MEDIA_ADMIN_TOKEN" ]; then
            echo "$TELEGRAM_MEDIA_ADMIN_TOKEN" | bunx wrangler secret put TELEGRAM_MEDIA_ADMIN_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Google Sheets service account secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" | bunx wrangler secret put GOOGLE_SHEETS_CREDENTIALS -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set GitHub Actions dispatch token (botão "Reportar problema")
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            echo "$GH_DISPATCH_TOKEN" | bunx wrangler secret put GH_DISPATCH_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Google Drive OAuth secrets (uploads de mídia nova)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -n "$DRIVE_OAUTH_CLIENT_ID" ]; then
            echo "$DRIVE_OAUTH_CLIENT_ID" | bunx wrangler secret put DRIVE_OAUTH_CLIENT_ID -c dist/tanstack_start_app/wrangler.json
          fi
          if [ -n "$DRIVE_OAUTH_CLIENT_SECRET" ]; then
            echo "$DRIVE_OAUTH_CLIENT_SECRET" | bunx wrangler secret put DRIVE_OAUTH_CLIENT_SECRET -c dist/tanstack_start_app/wrangler.json
          fi
          if [ -n "$DRIVE_OAUTH_REFRESH_TOKEN" ]; then
            echo "$DRIVE_OAUTH_REFRESH_TOKEN" | bunx wrangler secret put DRIVE_OAUTH_REFRESH_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Resend API key (e-mail de "conteúdo incorreto")
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | bunx wrangler secret put RESEND_API_KEY -c dist/tanstack_start_app/wrangler.json
          fi

name: Deploy Empire Hub

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Os dois workflows (deploy.yml e preview-sala-tv.yml) mexem no MESMO
      # Worker (tanstack-start-app). Em 28/11 o `secret put` do deploy falhou
      # porque a prévia subiu uma versão no meio. Este passo só ESPERA — nunca
      # cancela nada (um grupo de concorrência compartilhado poderia cancelar
      # um deploy de produção que estivesse na fila).
      # Espera só as execuções do outro workflow CRIADAS ANTES desta (em
      # andamento ou na fila): a mais antiga sempre passa primeiro, então os
      # dois nunca ficam esperando um ao outro.
      # Confere a cada 15 s, no máximo 10 min; depois segue com um aviso. Se a
      # consulta falhar (ex.: token sem permissão de ler Actions), não trava:
      # segue com um aviso no log.
      - name: Esperar preview-sala-tv.yml mais antigo terminar (mesmo Worker)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem `shell: bash` o padrão é `bash -e` (sem pipefail): sem isto, falha
          # do `gh` no pipe com o jq passaria despercebida (n vazio).
          set -o pipefail
          if ! meu=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt); then
            echo "::warning::Não consegui ler o horário desta execução; seguindo sem esperar."
            exit 0
          fi
          fim=$((SECONDS + 600))
          while true; do
            if ! n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow preview-sala-tv.yml --limit 20 --json status,createdAt \
                | jq --arg meu "$meu" '[.[] | select(.createdAt < $meu and (.status == "in_progress" or .status == "queued"))] | length'); then
              echo "::warning::Não consegui consultar preview-sala-tv.yml; seguindo sem esperar."
              break
            fi
            [ "$n" = "0" ] && break
            if [ "$SECONDS" -ge "$fim" ]; then
              echo "::warning::preview-sala-tv.yml mais antigo ainda rodando depois de 10 min; seguindo mesmo assim."
              break
            fi
            echo "preview-sala-tv.yml mais antigo rodando ($n); esperando 15 s..."
            sleep 15
          done

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      - name: Set Telegram media proxy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_MEDIA_ADMIN_TOKEN: ${{ secrets.TELEGRAM_MEDIA_ADMIN_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_MEDIA_ADMIN_TOKEN" ]; then
            echo "$TELEGRAM_MEDIA_ADMIN_TOKEN" | bunx wrangler secret put TELEGRAM_MEDIA_ADMIN_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Google Sheets service account secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" | bunx wrangler secret put GOOGLE_SHEETS_CREDENTIALS -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set GitHub Actions dispatch token (botão "Reportar problema")
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            echo "$GH_DISPATCH_TOKEN" | bunx wrangler secret put GH_DISPATCH_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Google Drive OAuth secrets (uploads de mídia nova)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -n "$DRIVE_OAUTH_CLIENT_ID" ]; then
            echo "$DRIVE_OAUTH_CLIENT_ID" | bunx wrangler secret put DRIVE_OAUTH_CLIENT_ID -c dist/tanstack_start_app/wrangler.json
          fi
          if [ -n "$DRIVE_OAUTH_CLIENT_SECRET" ]; then
            echo "$DRIVE_OAUTH_CLIENT_SECRET" | bunx wrangler secret put DRIVE_OAUTH_CLIENT_SECRET -c dist/tanstack_start_app/wrangler.json
          fi
          if [ -n "$DRIVE_OAUTH_REFRESH_TOKEN" ]; then
            echo "$DRIVE_OAUTH_REFRESH_TOKEN" | bunx wrangler secret put DRIVE_OAUTH_REFRESH_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set Resend API key (e-mail de "conteúdo incorreto")
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | bunx wrangler secret put RESEND_API_KEY -c dist/tanstack_start_app/wrangler.json
          fi

      - name: Set charts ingest token (envio semanal dos charts pro D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHARTS_INGEST_TOKEN: ${{ secrets.CHARTS_INGEST_TOKEN }}
        run: |
          if [ -n "$CHARTS_INGEST_TOKEN" ]; then
            echo "$CHARTS_INGEST_TOKEN" | bunx wrangler secret put CHARTS_INGEST_TOKEN -c dist/tanstack_start_app/wrangler.json
          fi
